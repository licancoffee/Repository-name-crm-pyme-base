name: Certificar idempotencia V1

on:
  push:
    branches:
      - respaldo-instalador-avanzado
    paths:
      - docs/CERTIFICAR_IDEMPOTENCIA.trigger

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar doble anulación sin reponer stock otra vez
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbz7VdWsZweq5ncUhMUIftgWqnutIVlEZali6qx_dwmyHP2cth1wyrmzP_EJnEmKI50PEw/exec'
          CLIENT='CL-763396002'
          SALE='VT-20260904-1788577919085'

          BEFORE=$(curl -fsSL "$BASE?action=bootstrap&clientId=$CLIENT")
          RESP=$(curl -fsSL -H 'Content-Type: text/plain;charset=utf-8' --data "{\"action\":\"anularVenta\",\"clientId\":\"$CLIENT\",\"ventaId\":\"$SALE\"}" "$BASE")
          AFTER=$(curl -fsSL "$BASE?action=bootstrap&clientId=$CLIENT")

          python - <<'PY' "$BEFORE" "$RESP" "$AFTER" "$SALE"
          import json, sys
          before=json.loads(sys.argv[1]); resp=json.loads(sys.argv[2]); after=json.loads(sys.argv[3]); sale=sys.argv[4]
          assert before.get('ok') is True, before
          assert after.get('ok') is True, after
          assert resp.get('ok') is True, resp
          data=resp.get('data') or {}
          assert data.get('ventaId') == sale, data
          assert data.get('estado') == 'ANULADA', data
          assert data.get('duplicada') is True, data
          b={str(x.get('codigo')): float(x.get('stockActual',0)) for x in before.get('inventario',[])}
          a={str(x.get('codigo')): float(x.get('stockActual',0)) for x in after.get('inventario',[])}
          assert b == a, (b,a)
          print('IDEMPOTENCIA_ANULACION_OK')
          PY

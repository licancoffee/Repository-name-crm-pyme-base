name: CI

on:
  push:
    branches:
      - respaldo-instalador-avanzado
  pull_request:
    branches:
      - respaldo-instalador-avanzado

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

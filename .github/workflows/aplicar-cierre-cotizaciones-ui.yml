name: Aplicar cierre UI cotizaciones

on:
  push:
    branches:
      - respaldo-instalador-avanzado
    paths:
      - tools/aplicar-cierre-cotizaciones-ui.py

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: respaldo-instalador-avanzado
          fetch-depth: 0

      - name: Aplicar ajustes UI
        run: python tools/aplicar-cierre-cotizaciones-ui.py

      - name: Commit cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/nueva-cotizacion.tsx src/routes/historial-cotizaciones.tsx
          git commit -m "Cierra WhatsApp y reenvío de cotizaciones en UI"
          git push origin HEAD:respaldo-instalador-avanzado

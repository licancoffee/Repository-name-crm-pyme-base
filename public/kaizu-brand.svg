<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">Kaizu</title>
  <desc id="desc">Kaizu · Ordena. Vende. Crece.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#063b78"/>
      <stop offset="0.48" stop-color="#0b8fa6"/>
      <stop offset="1" stop-color="#19d8c7"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#18c8c6"/>
      <stop offset="1" stop-color="#7df2e7"/>
    </linearGradient>
  </defs>

  <!-- Isotipo -->
  <rect x="18" y="28" width="184" height="184" rx="42" fill="url(#bg)"/>

  <!-- K limpia -->
  <rect x="66" y="68" width="34" height="112" rx="8" fill="#ffffff"/>
  <path d="M96 128 L150 72 Q156 66 165 66 H194 L127 134 Z" fill="#ffffff"/>
  <path d="M121 133 L193 206 H158 Q150 206 144 199 L101 154 Z" fill="#ffffff"/>

  <!-- Crecimiento integrado, sin deformar la K -->
  <path d="M68 167 L91 148 L112 135 L139 111" fill="none" stroke="url(#slash)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M133 108 L149 105 L144 121" fill="none" stroke="#7df2e7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Barras -->
  <rect x="72" y="169" width="12" height="27" rx="2" fill="none" stroke="#ffffff" stroke-width="5"/>
  <rect x="91" y="158" width="12" height="38" rx="2" fill="none" stroke="#ffffff" stroke-width="5"/>
  <rect x="110" y="145" width="12" height="51" rx="2" fill="none" stroke="#ffffff" stroke-width="5"/>

  <!-- Logotipo -->
  <text x="236" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#0a3766">Kaizu</text>
  <text x="242" y="166" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500" fill="#0e4a87">Ordena. Vende. Crece.</text>
</svg>

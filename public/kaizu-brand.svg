  <rect x="66" y="68" width="34" height="116" rx="8" fill="#ffffff"/>
  <path d="M96 129 L151 71 Q156 66 164 66 H194 L125 136 Z" fill="url(#arm)"/>
  <path d="M120 134 L192 206 H157 Q149 206 143 199 L101 155 Z" fill="#ffffff"/>


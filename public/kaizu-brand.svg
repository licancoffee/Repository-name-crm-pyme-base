      <stop offset="0" stop-color="#063b78"/>
      <stop offset="0.48" stop-color="#0b8fa6"/>
      <stop offset="1" stop-color="#19d8c7"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#16c9c3"/>
      <stop offset="0.42" stop-color="#8ef1e9"/>

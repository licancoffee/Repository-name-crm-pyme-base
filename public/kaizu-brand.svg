  <rect x="76" y="174" width="10" height="21" rx="1.5" fill="#ffffff"/>
  <rect x="91" y="162" width="10" height="33" rx="1.5" fill="#ffffff"/>
  <rect x="106" y="149" width="10" height="46" rx="1.5" fill="#ffffff"/>
  <path d="M68 168 L91 150 L111 138 L140 112" fill="none" stroke="#23d2c8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

